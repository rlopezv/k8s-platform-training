{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform-api.secretName" . }}
  namespace: {{ include "platform-api.namespace" . }}
  labels:
{{- include "platform-api.componentLabels" (dict "root" . "component" "configuration") | nindent 4 }}
type: Opaque
stringData:
  LAB_CLIENT_ID: {{ .Values.secret.labClientId | quote }}
  LAB_API_TOKEN: {{ .Values.secret.labApiToken | quote }}
{{- end }}
