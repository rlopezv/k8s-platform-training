apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "platform-api.configMapName" . }}
  namespace: {{ include "platform-api.namespace" . }}
  labels:
{{- include "platform-api.componentLabels" (dict "root" . "component" "configuration") | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  FEATURE_GREETING: {{ .Values.config.featureGreeting | quote }}
  index.html: |
{{- .Values.config.indexHtml | nindent 4 }}
