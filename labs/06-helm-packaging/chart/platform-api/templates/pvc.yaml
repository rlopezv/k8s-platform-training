{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "platform-api.pvcName" . }}
  namespace: {{ include "platform-api.namespace" . }}
  labels:
{{- include "platform-api.componentLabels" (dict "root" . "component" "storage") | nindent 4 }}
spec:
  accessModes:
{{- toYaml .Values.persistence.accessModes | nindent 4 }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
