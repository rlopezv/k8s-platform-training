apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scratch-stateful
  namespace: platform-training
  labels:
    app.kubernetes.io/name: scratch-stateful
    app.kubernetes.io/instance: scratch-stateful-local
    app.kubernetes.io/component: demo
    app.kubernetes.io/part-of: k8s-platform-training
    app.kubernetes.io/managed-by: kubectl
    training.k8s-platform.io/unit: "04"
    training.k8s-platform.io/purpose: statefulset-demo
spec:
  serviceName: scratch-stateful
  podManagementPolicy: Parallel
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: scratch-stateful
      app.kubernetes.io/instance: scratch-stateful-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scratch-stateful
        app.kubernetes.io/instance: scratch-stateful-local
        app.kubernetes.io/component: demo
        app.kubernetes.io/part-of: k8s-platform-training
        training.k8s-platform.io/unit: "04"
        training.k8s-platform.io/purpose: statefulset-demo
    spec:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 20
      containers:
        - name: scratch-stateful
          image: nginxinc/nginx-unprivileged:1.27.4-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /usr/share/nginx/html/stateful
              printf 'pod=%s\nclaim=%s\n' "$HOSTNAME" "scratch-data-$HOSTNAME" > /usr/share/nginx/html/stateful/identity.txt
              exec nginx -g 'daemon off;'
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: scratch-data
              mountPath: /usr/share/nginx/html/stateful
          readinessProbe:
            httpGet:
              path: /stateful/identity.txt
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /stateful/identity.txt
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: scratch-data
        labels:
          app.kubernetes.io/name: scratch-stateful
          app.kubernetes.io/instance: scratch-stateful-local
          app.kubernetes.io/component: storage
          app.kubernetes.io/part-of: k8s-platform-training
          app.kubernetes.io/managed-by: kubectl
          training.k8s-platform.io/unit: "04"
          training.k8s-platform.io/purpose: statefulset-demo
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: microk8s-hostpath
        resources:
          requests:
            storage: 256Mi
