apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform-training
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/instance: platform-api-local
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: k8s-platform-training
    app.kubernetes.io/managed-by: kubectl
    training.k8s-platform.io/unit: "04"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
      app.kubernetes.io/instance: platform-api-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api
        app.kubernetes.io/instance: platform-api-local
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: k8s-platform-training
        training.k8s-platform.io/unit: "04"
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: platform-api
          image: nginxinc/nginx-unprivileged:1.27.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: platform-api-config
                  key: APP_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: platform-api-config
                  key: LOG_LEVEL
            - name: FEATURE_GREETING
              valueFrom:
                configMapKeyRef:
                  name: platform-api-config
                  key: FEATURE_GREETING
            - name: LAB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: platform-api-secret
                  key: LAB_CLIENT_ID
            - name: LAB_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-api-secret
                  key: LAB_API_TOKEN
          volumeMounts:
            - name: platform-api-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: platform-api-content
          configMap:
            name: platform-api-config
            items:
              - key: index.html
                path: index.html
