apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-api
  namespace: platform-training
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/instance: platform-api-local
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: k8s-platform-training
    app.kubernetes.io/managed-by: kubectl
    training.k8s-platform.io/unit: "04"
spec:
  ingressClassName: public
  rules:
    - host: platform-api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform-api
                port:
                  number: 80
