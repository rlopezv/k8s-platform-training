apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform-training
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/instance: platform-api-local
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: k8s-platform-training
    app.kubernetes.io/managed-by: kubectl
    training.k8s-platform.io/unit: "01"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
      app.kubernetes.io/instance: platform-api-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api
        app.kubernetes.io/instance: platform-api-local
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: k8s-platform-training
        training.k8s-platform.io/unit: "01"
    spec:
      containers:
        - name: platform-api
          image: nginxinc/nginx-unprivileged:1.27.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
