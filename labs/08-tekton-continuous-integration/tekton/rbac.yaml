apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-api-ci-read
  namespace: platform-training
  labels:
    app.kubernetes.io/part-of: k8s-platform-training
    training.k8s-platform.io/unit: "08"
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services", "persistentvolumeclaims", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-api-ci-read
  namespace: platform-training
  labels:
    app.kubernetes.io/part-of: k8s-platform-training
    training.k8s-platform.io/unit: "08"
subjects:
  - kind: ServiceAccount
    name: platform-api-ci
    namespace: platform-training
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-api-ci-read
