apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-api-data
  namespace: platform-training
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/instance: platform-api-local
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: k8s-platform-training
    app.kubernetes.io/managed-by: kubectl
    training.k8s-platform.io/unit: "05"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 1Gi
